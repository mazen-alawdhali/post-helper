<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مساعد النشر - Post Helper</title>
  
  <!-- إعدادات تطبيق الويب (PWA) -->
  <meta name="theme-color" content="#18191A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مساعد النشر">
  
  <!-- أيقونة مكبر الصوت للمتصفح -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📢</text></svg>">
  
  <!-- ملف Manifest مدمج لتثبيت التطبيق -->
  <link rel="manifest" href='data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%D9%85%D8%B3%D8%A7%D8%B9%D8%AF%20%D8%A7%D9%84%D9%86%D8%B4%D8%B1%22%2C%22short_name%22%3A%22%D9%85%D8%B3%D8%A7%D8%B9%D8%AF%20%D8%A7%D9%84%D9%86%D8%B4%D8%B1%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2318191A%22%2C%22theme_color%22%3A%22%2318191A%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%3Butf8%2C%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%27.9em%27%20font-size%3D%2790%27%3E%F0%9F%93%A2%3C%2Ftext%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D'>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      padding: 15px;
      background-color: #18191A; 
      color: #E4E6EB; 
      font-family: 'Cairo', sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .app-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 15px; }
    h2 { text-align: center; color: #4599FF; margin: 0 0 10px 0; font-weight: 700; }
    
    .card { background: #242526; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; box-sizing: border-box; border: 1px solid #333; }
    .card h3 { margin: 0 0 10px 0; font-size: 16px; color: #E4E6EB; }

    /* شريط تنسيق النص في سطر واحد */
    .toolbar { display: flex; gap: 6px; margin-bottom: 10px; width: 100%; }
    .toolbar button { flex: 1; background-color: #3A3B3C; color: #E4E6EB; border: 1px solid #555; padding: 8px 2px; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: bold; font-size: 12px; white-space: nowrap; text-align: center; transition: background 0.2s; }
    .toolbar button:active { background-color: #555; }
    .toolbar button:hover { background-color: #4A4B4C; }

    #postEditor { width: 100%; min-height: 100px; padding: 12px; background-color: #3A3B3C; color: #E4E6EB; border: 1px solid #555; border-radius: 8px; margin-bottom: 10px; font-size: 15px; outline: none; box-sizing: border-box; font-family: inherit; resize: none; overflow: hidden; }
    #postEditor:focus { border-color: #4599FF; }
    #postEditor::placeholder { color: #B0B3B8; }
    
    /* أزرار النسخ والحذف متساوية الحجم تماماً */
    .actions-row { display: flex; gap: 10px; width: 100%; }
    .btn-copy { flex: 1; background: #31A24C; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 700; font-family: inherit; transition: 0.3s; text-align: center; }
    .btn-copy.copied { background: #2b8f42; }
    
    .btn-clear { flex: 1; background: #3A3B3C; color: #E4E6EB; border: 1px solid #555; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 700; font-family: inherit; transition: background 0.2s, border-color 0.2s; text-align: center; }
    .btn-clear:hover { background: #E41E3F; border-color: #E41E3F; color: white; }

    .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .input-group input { width: 100%; padding: 12px; background-color: #3A3B3C; color: #E4E6EB; border: 1px solid #555; border-radius: 8px; font-size: 14px; box-sizing: border-box; font-family: inherit; }
    .input-group input::placeholder { color: #B0B3B8; }
    #newLink { text-align: center; }
    #newLink:focus { text-align: left; direction: ltr; }

    .btn-add { background: #2374E1; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 15px; width: 100%; font-family: inherit; }

    /* أزرار النسخ الاحتياطي */
    .backup-row { display: flex; gap: 10px; margin-top: 10px; }
    .btn-backup { flex: 1; background: #2D3748; color: #E4E6EB; border: 1px solid #4A5568; padding: 8px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; text-align: center; transition: background 0.2s; }
    .btn-backup:hover { background: #4A5568; }

    .group-item { display: flex; flex-direction: column; padding: 15px 0; border-bottom: 1px solid #3E4042; gap: 12px; }
    .group-item:last-child { border-bottom: none; padding-bottom: 0; }
    .group-item.done { opacity: 0.5; background-color: #1c2b20; border-radius: 8px; padding: 15px 10px; border-bottom: none; }

    .group-info { display: flex; align-items: flex-start; gap: 10px; width: 100%; }
    .group-num { color: #B0B3B8; font-size: 14px; font-weight: 700; min-width: 15px; margin-top: 3px; }
    
    input[type="checkbox"] { transform: scale(1.4); margin: 4px 5px 0 5px; cursor: pointer; accent-color: #31A24C; flex-shrink: 0; }
    .group-name { font-size: 15px; font-weight: 600; color: #E4E6EB; word-break: break-word; line-height: 1.5; flex: 1; }
    
    .group-actions { display: flex; gap: 10px; padding-right: 38px; }
    .btn-open, .btn-delete { flex: 1; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; text-align: center; }
    .btn-open { background: #2374E1; }
    .btn-delete { background: #E41E3F; }

    /* حقوق الملكية والتطوير */
    .app-footer {
      text-align: center;
      padding: 15px 0 5px 0;
      color: #B0B3B8;
      font-size: 13px;
      border-top: 1px solid #2F3031;
      margin-top: 10px;
    }
    .app-footer a {
      text-decoration: none;
    }
    .app-footer strong {
      color: #4599FF;
      font-weight: 700;
      transition: color 0.3s ease;
    }
    .app-footer a:hover strong {
      color: #2374E1;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h2>مساعد النشر 📢</h2>

    <div class="card">
      <div class="toolbar">
        <button onclick="formatText('【 ', ' 🔥')" title="عنوان مؤطر">【 عنوان 】</button>
        <button onclick="insertSeparator()" title="سطر فاصل">══ فاصل</button>
        <button onclick="formatText('🔹 ', '')" title="نقطة قائمة">🔹 نقطة</button>
        <button onclick="formatText('✅ ', '')" title="صح">✅ تم</button>
      </div>

      <textarea id="postEditor" placeholder="اكتب نص المنشور هنا... (سيتم حفظه تلقائياً)" oninput="savePostText(); autoResize(this)"></textarea>
      
      <div class="actions-row">
        <button class="btn-copy" id="copyBtn" onclick="copyText()">📋 نسخ المنشور</button>
        <button class="btn-clear" onclick="clearText()">🗑️ مسح النص</button>
      </div>
    </div>

    <div class="card">
      <h3>إضافة مجموعة جديدة:</h3>
      <div class="input-group">
        <input type="url" id="newLink" placeholder="...الصق رابط المجموعة هنا..." dir="ltr">
        <input type="text" id="newName" placeholder="اسم المجموعة...">
      </div>
      <button class="btn-add" onclick="addNewGroup()">➕ إضافة إلى القائمة</button>

      <!-- أزرار أخذ واستعادة نسخة احتياطية -->
      <div class="backup-row">
        <button class="btn-backup" onclick="exportData()">💾 تصدير المجموعات</button>
        <button class="btn-backup" onclick="triggerImport()">📂 استيراد المجموعات</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
      </div>
    </div>

    <div class="card" id="groupsList">
      <!-- سيتم إدراج المجموعات هنا -->
    </div>

    <!-- شريط حقوق الملكية مع الرابط -->
    <div class="app-footer">
      جميع الحقوق محفوظة © <span id="currentYear"></span> | تطوير: <a href="https://www.facebook.com/share/1FwEecrEPq/" target="_blank" rel="noopener noreferrer"><strong>م. مازن العوذلي</strong></a>
    </div>
  </div>

  <script>
    function formatText(startTag, endTag) {
      const textarea = document.getElementById('postEditor');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      const selectedText = text.substring(start, end);
      textarea.value = text.substring(0, start) + startTag + selectedText + endTag + text.substring(end);
      textarea.focus();
      if (selectedText.length === 0) { textarea.selectionStart = textarea.selectionEnd = start + startTag.length; } 
      else { textarea.selectionStart = textarea.selectionEnd = start + startTag.length + selectedText.length + endTag.length; }
      savePostText(); autoResize(textarea);
    }

    function insertSeparator() {
      const textarea = document.getElementById('postEditor');
      const start = textarea.selectionStart;
      const text = textarea.value;
      const separator = "\n═══════════════════════\n";
      textarea.value = text.substring(0, start) + separator + text.substring(start);
      textarea.focus();
      textarea.selectionStart = textarea.selectionEnd = start + separator.length;
      savePostText(); autoResize(textarea);
    }

    function autoResize(element) {
      element.style.height = 'auto'; 
      element.style.height = (element.scrollHeight) + 'px'; 
    }

    function savePostText() { localStorage.setItem('savedPostText', document.getElementById('postEditor').value); }
    
    function copyText() {
      const textarea = document.getElementById('postEditor');
      const copyBtn = document.getElementById('copyBtn');
      if (!textarea.value.trim()) return alert('المنشور فارغ!');
      navigator.clipboard.writeText(textarea.value).then(() => {
        copyBtn.innerHTML = '✔️ تم النسخ بنجاح!'; copyBtn.classList.add('copied');
        setTimeout(() => { copyBtn.innerHTML = '📋 نسخ المنشور'; copyBtn.classList.remove('copied'); }, 2000);
      }).catch(err => { alert('فشل النسخ تلقائياً، يرجى النسخ يدوياً.'); });
    }

    function clearText() {
      const textarea = document.getElementById('postEditor');
      if (!textarea.value.trim()) return;
      if (confirm('هل أنت متأكد من مسح نص المنشور الحالي؟')) {
        textarea.value = '';
        savePostText();
        autoResize(textarea);
        textarea.focus();
      }
    }

    let groups = JSON.parse(localStorage.getItem('solarGroupsList')) || [];

    function saveGroupsData() { localStorage.setItem('solarGroupsList', JSON.stringify(groups)); }

    // دوال النسخ الاحتياطي (تصدير واستيراد)
    function exportData() {
      if (groups.length === 0) {
        alert('القائمة فارغة لتصديرها!');
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(groups, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "groups_backup.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerImport() {
      document.getElementById('importFile').click();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            if (confirm(`تم العثور على ${imported.length} مجموعة. هل تريد دمجها مع القائمة الحالية أم استبدالها؟\nموافق = استبدال الكل | إلغاء = دمج`)) {
              groups = imported;
            } else {
              // دمج بدون تكرار الروابط
              imported.forEach(impGroup => {
                if (!groups.some(g => g.link.toLowerCase() === impGroup.link.toLowerCase())) {
                  groups.push(impGroup);
                }
              });
            }
            saveGroupsData();
            renderList();
            alert('تم استيراد المجموعات بنجاح!');
          } else {
            alert('ملف غير صالح!');
          }
        } catch (err) {
          alert('حدث خطأ أثناء قراءة الملف.');
        }
      };
      reader.readAsText(file);
      event.target.value = ''; // إعادة تعيين الحقل
    }

    function addNewGroup() {
      const linkInput = document.getElementById('newLink');
      const nameInput = document.getElementById('newName');
      
      let link = linkInput.value.trim();
      const name = nameInput.value.trim() || 'اسم المجموعة';

      if (!link) {
        alert('الرجاء إدخال رابط المجموعة أولاً.');
        return;
      }
      if (!link.startsWith('http')) link = 'https://' + link;

      const isLinkDuplicate = groups.some(group => group.link.toLowerCase() === link.toLowerCase());
      const isNameDuplicate = groups.some(group => group.name.toLowerCase() === name.toLowerCase() && name !== 'اسم المجموعة');

      if (isLinkDuplicate) {
        alert('⚠️ عذراً، هذا الرابط موجود مسبقاً في القائمة!');
        return;
      }

      if (isNameDuplicate) {
        alert('⚠️ عذراً، يوجد مجموعة بهذا الاسم مسبقاً! يرجى اختيار اسم آخر لتمييزها.');
        return;
      }

      groups.push({ id: Date.now(), name: name, link: link, done: false });
      saveGroupsData();
      renderList();

      linkInput.value = '';
      nameInput.value = '';

      setTimeout(() => {
        const list = document.getElementById('groupsList');
        if (list.lastElementChild) list.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'end' });
      }, 100);
    }

    function renderList() {
      const listContainer = document.getElementById('groupsList');
      listContainer.innerHTML = '';
      if (groups.length === 0) {
        listContainer.innerHTML = '<div style="text-align:center; color:#B0B3B8; font-size: 14px; padding:10px;">لا توجد مجموعات مضافة بعد.</div>';
        return;
      }
      groups.forEach((group, index) => {
        const item = document.createElement('div');
        item.className = `group-item ${group.done ? 'done' : ''}`;
        item.innerHTML = `
          <div class="group-info">
            <span class="group-num">${index + 1}</span>
            <input type="checkbox" ${group.done ? 'checked' : ''} onchange="toggleDone(${index}, this.checked)">
            <span class="group-name">${group.name}</span>
          </div>
          <div class="group-actions">
            <button class="btn-open" onclick="openGroup('${group.link}')">فتح</button>
            <button class="btn-delete" onclick="deleteGroup(${index})">حذف</button>
          </div>
        `;
        listContainer.appendChild(item);
      });
    }

    function toggleDone(index, isChecked) { groups[index].done = isChecked; saveGroupsData(); renderList(); }
    function openGroup(link) { window.open(link, '_blank'); }
    function deleteGroup(index) {
      if (confirm('هل أنت متأكد من حذف هذه المجموعة؟')) { groups.splice(index, 1); saveGroupsData(); renderList(); }
    }

    window.onload = function() {
      const savedText = localStorage.getItem('savedPostText');
      const editor = document.getElementById('postEditor');
      if (savedText) { editor.value = savedText; autoResize(editor); }
      renderList();

      // تحديث السنة تلقائياً
      document.getElementById('currentYear').textContent = new Date().getFullYear();
    };
  </script>
</body>
</html>
